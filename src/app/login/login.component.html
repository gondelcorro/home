<app-acceso-layout>
  <section class="login-box" aria-labelledby="login-title">
    <header class="form-heading">
      <p class="eyebrow">Tu cuenta</p>
      <h2 id="login-title">Bienvenido de nuevo</h2>
      <p>Ingresá tus datos para continuar.</p>
    </header>

    <form class="login-form formulario-acceso" (ngSubmit)="iniciarSesion()" novalidate>
      <mat-form-field appearance="outline" subscriptSizing="dynamic" floatLabel="always">
        <mat-label>Correo electrónico</mat-label>

        <input
          matInput
          type="email"
          name="usuario"
          autocomplete="username"
          [(ngModel)]="usuario"
          required
        />

        <mat-icon matSuffix>mail_outline</mat-icon>
        <mat-error>Ingresá tu correo electrónico.</mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline" subscriptSizing="dynamic" floatLabel="always">
        <mat-label>Contraseña</mat-label>

        <input
          matInput
          name="clave"
          autocomplete="current-password"
          [(ngModel)]="clave"
          [type]="hide ? 'password' : 'text'"
          required
        />

        <button
          mat-icon-button
          matSuffix
          type="button"
          (click)="hide = !hide"
          [attr.aria-label]="
            hide ? 'Mostrar contraseña' : 'Ocultar contraseña'
          "
        >
          <mat-icon>
            {{ hide ? "visibility_off" : "visibility" }}
          </mat-icon>
        </button>

        <mat-error>Ingresá tu contraseña.</mat-error>
      </mat-form-field>

      <a class="forgot-password" [href]="url_recuperarClave">
        ¿Olvidaste tu contraseña?
      </a>

      <button mat-flat-button class="submit-button" type="submit">
        Iniciar sesión
      </button>
    </form>

    <p class="signup cambio-acceso">
      ¿Todavía no tenés cuenta?
      <a routerLink="/registro">Registrate</a>
    </p>
  </section>
</app-acceso-layout>
